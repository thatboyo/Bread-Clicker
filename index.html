<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <title>Bread Clicker</title>
</head>
<body>
    <h1>Bread Clicker</h1>
    <div id="menu">
        <button id="menuBtn" type="button">Menu</button>
        <div id="menuPanel" hidden>
            <button id="saveBtn" type ="button">Save</button>
            <button id="loadBtn" type="button">Load</button>
            <button id="infoBtn" type="button">Info</button>
            <button id="12">Testing Button</button>

            <div id="saveArea" hidden>
                <p>Your save code:</p>
                <textarea id="saveCode" readonly rows="4"></textarea>
                <button id="copyBtn" type="button">Copy</button>
            </div>

            <div id="loadArea" hidden>
                <p>Paste your save code:</p>
                <textarea id="loadCode" rows="4"></textarea>
                <button id="loadGo" type="button">Load Game</button>
                <p id="loadMsg"></p>
            </div>            
        </div>
    </div>
    <div id="craftingOverlay" hidden>
        <div id="craftingPanel" role="dialog" aria-modal="true" aria-labelledby="craftingTitle">
            <button id="close" type="button" aria-label="Close">X</button>
            <h2 id="craftingTitle">Crafting Table</h2>
            <div id="craftingBody">
                <div id="craftingGrid">
                    <div class="slot"></div><div class="slot"></div><div class="slot"></div>
                    <div class="slot"></div><div class="slot"></div><div class="slot"></div>
                    <div class="slot"></div><div class="slot"></div><div class="slot"></div>
                </div>
                <div id="craftingArrow">&rarr;</div>
                <div id="craftingResult" class="slot"></div>
            </div>
            <div id="craftingUpgrades">
                <!---gotta figure what upgrades i want-->
            </div>
        </div>
    </div>
    <div id="game">
        <div id="left">
            <button id="bread" type="button" aria-label="Bake bread">
            <img src="download.jpeg" alt="Bread"></button>
            <p id="amount">Bread Baked: </p>
            <p id="BPS">Bread per Second: </p>
        </div>
        <div id="divider">
        </div>
        <div id="right">
            <button id="1">Hire a Chungie</button>
            <button id="2">Buy a Toaster</button>
            <button id="3">Buy a Bakery</button>
            <button id="4">Buy a Robot</button>
            <div class="row">
                <button id="5">Invest in a Crafting Table</button>
                <button id="craft" type ="button" aria-label="Open Crafting Table" hidden>&#9638;</button>
            </div>
            <button id="6">Gamble at a Casino (working but WIP)</button>
            <button id="7">Hire a Villager</button>
            <button id="8">Code a Command Block</button>
            <button id="9">Invent a Magical Bread Machine</button>
            <button id="10">Play Snake (MiniGame) (WIP)</button>
            <button id="11">Buy Amazon! (Your Goal!)</button>
            
            
        </div>
    </div>
   
    
</body>
</html>

       going so good so far :)
